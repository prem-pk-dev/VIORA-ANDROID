name: Build VIORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIORA_SOURCE_TOKEN: ${{ secrets.VIORA_SOURCE_TOKEN }}

    steps:
      - name: Check private-source access
        shell: bash
        run: |
          if [ -z "$VIORA_SOURCE_TOKEN" ]; then
            echo "::error::Add the VIORA_SOURCE_TOKEN Actions secret (fine-grained token with Contents: Read-only access to prem-pk-dev/VILORA)."
            exit 1
          fi

      - name: Checkout Android repository
        uses: actions/checkout@v4

      - name: Checkout the existing VIORA PWA (read-only)
        uses: actions/checkout@v4
        with:
          repository: prem-pk-dev/VILORA
          ref: main
          path: viora-source
          token: ${{ secrets.VIORA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit private PWA playback source contracts (read-only)
        run: node scripts/audit-viora-playback-source.mjs viora-source

      - name: Upload sanitized PWA playback audit
        uses: actions/upload-artifact@v4
        with:
          name: VIORA-playback-source-audit
          path: artifacts/viora-playback-source-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit private PWA search, track model, and branding contracts (read-only)
        run: node scripts/audit-viora-integration-source.mjs viora-source

      - name: Upload sanitized PWA integration audit
        uses: actions/upload-artifact@v4
        with:
          name: VIORA-integration-source-audit
          path: artifacts/viora-integration-source-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Inspect lyrics identity and driving assistant contracts (read-only)
        run: node scripts/inspect-viora-lyrics-driving.mjs viora-source

      - name: Upload targeted lyrics and driving inspection
        uses: actions/upload-artifact@v4
        with:
          name: VIORA-lyrics-driving-inspection
          path: artifacts/viora-lyrics-driving-inspection.json
          if-no-files-found: error
          retention-days: 14

      - name: Inspect complete driving mode and voice assistant implementation
        run: node scripts/inspect-viora-driving-mode.mjs viora-source

      - name: Upload driving mode and voice assistant inspection
        uses: actions/upload-artifact@v4
        with:
          name: VIORA-driving-mode-inspection
          path: artifacts/viora-driving-mode-inspection.json
          if-no-files-found: error
          retention-days: 14

      - name: Test Android radio patcher against isolated fixture
        run: node scripts/test-android-radio-patch.mjs

      - name: Test India-first music provider waterfall
        run: |
          node --check scripts/india-music-engine.js
          node --check scripts/patch-android-music.mjs
          node --check scripts/patch-android-lyrics.mjs
          node --check scripts/inspect-viora-lyrics-driving.mjs
          node --check scripts/inspect-viora-driving-mode.mjs
          node scripts/test-india-music-engine.mjs

      - name: Test Android driving mode and voice assistant patch
        run: |
          node --check scripts/patch-android-driving.mjs
          node --check scripts/test-android-driving-patch.mjs
          node scripts/test-android-driving-patch.mjs

      - name: Apply Android-only radio and India music adapters to temporary PWA checkout
        run: |
          node scripts/patch-android-radio.mjs viora-source
          test -s viora-source/js/android-radio-adapter.js
          test -s viora-source/android-radio-patch-report.json
          node scripts/patch-android-music.mjs viora-source
          test -s viora-source/js/india-music-engine.js
          test -s viora-source/android-india-music-patch-report.json
          node scripts/patch-android-lyrics.mjs viora-source
          test -s viora-source/android-lyrics-patch-report.json
          node scripts/patch-android-driving.mjs viora-source
          test -s viora-source/android-driving-patch-report.json

      - name: Validate patched JavaScript syntax
        run: |
          node --check viora-source/js/ui.js
          node --check viora-source/js/audio-engine.js
          node --check viora-source/js/state.js
          node --check viora-source/js/player.js
          node --check viora-source/js/india-music-engine.js
          node --check viora-source/js/lyrics.js
          node --check viora-source/js/expansion.js
          node --check viora-source/js/android-driving-voice.js

      - name: Build the unchanged PWA frontend
        working-directory: viora-source
        run: |
          npm install --no-audit --no-fund
          npm run build
          if ! grep -Rqs "radio.getSnapshot" dist/assets; then
            echo "::error::Android radio adapter marker missing from generated PWA bundle."
            exit 1
          fi
          if ! grep -Rqs "viora-native-radio-mode" dist/assets; then
            echo "::error::Native/Web MediaSession ownership handoff missing from generated PWA bundle."
            exit 1
          fi
          if ! grep -Rqs "VIORA_INDIA_MUSIC_WATERFALL_V1" dist/assets; then
            echo "::error::India-first music waterfall missing from generated PWA bundle."
            exit 1
          fi
          if ! grep -Rqs "online:jiosaavn:" dist/assets; then
            echo "::error::Normalized online track identity missing from generated PWA bundle."
            exit 1
          fi

      - name: Restore the PWA root-level motion script into Vite output
        shell: bash
        run: |
          test -s viora-source/js/immersive-motion.js
          mkdir -p viora-source/dist/js
          cp viora-source/js/immersive-motion.js viora-source/dist/js/immersive-motion.js
          test -s viora-source/dist/js/immersive-motion.js

      - name: Remove stale offline precache paths from Android bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const dist = path.resolve("viora-source/dist");
          const swPath = path.join(dist, "sw.js");
          if (!fs.existsSync(swPath)) throw new Error("Expected PWA service worker at dist/sw.js");
          const source = fs.readFileSync(swPath, "utf8");
          const match = source.match(/const APP_SHELL = \[([\s\S]*?)\];/);
          if (!match) throw new Error("Could not locate APP_SHELL in PWA service worker");
          const configured = [...match[1].matchAll(/"([^"]+)"/g)].map((entry) => entry[1]);
          configured.push("/js/immersive-motion.js");
          const existing = [...new Set(configured)].filter((asset) => {
            const relative = asset === "/" ? "index.html" : asset.replace(/^\/+/, "");
            return fs.existsSync(path.join(dist, relative));
          });
          if (!existing.includes("/index.html")) throw new Error("Offline shell is missing index.html");
          const replacement = "const APP_SHELL = [\n" +
            existing.map((asset) => "  " + JSON.stringify(asset)).join(",\n") +
            "\n];";
          fs.writeFileSync(swPath, source.replace(match[0], replacement));
          console.log("Android offline precache: " + existing.length + " existing assets retained; " +
            (configured.length - existing.length) + " stale paths removed.");
          NODE

      - name: Bundle PWA build and exact launcher icon
        shell: bash
        run: |
          test -f viora-source/dist/index.html
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/*
          cp -R viora-source/dist/. app/src/main/assets/
          mkdir -p app/src/main/res/drawable-nodpi
          cp viora-source/public/icons/icon-512.png app/src/main/res/drawable-nodpi/viora_icon.png
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/js/immersive-motion.js
          test -f app/src/main/assets/sw.js
          test -f app/src/main/res/drawable-nodpi/viora_icon.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Run lyrics identity unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Restore stable internal debug signing key
        shell: bash
        run: |
          base64 --decode keystore/viora-debug.keystore.b64 > app/viora-debug.keystore
          test -s app/viora-debug.keystore
          keytool -list -keystore app/viora-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VIORA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android Emulator launch and lifecycle smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-emulator-smoke-test.sh"
