name: Build VIORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIORA_SOURCE_TOKEN: ${{ secrets.VIORA_SOURCE_TOKEN }}
      VIORA_API_BASE_URL: ${{ vars.VIORA_API_BASE_URL }}

    steps:
      - name: Check required private-source access and API origin
        shell: bash
        run: |
          if [ -z "$VIORA_SOURCE_TOKEN" ]; then
            echo "::error::Add the VIORA_SOURCE_TOKEN Actions secret (fine-grained token with Contents: Read-only access to prem-pk-dev/VILORA)."
            exit 1
          fi
          if [ -z "$VIORA_API_BASE_URL" ]; then
            echo "::error::Add the VIORA_API_BASE_URL Actions variable. It must be an HTTPS API origin accessible without interactive login or SSO."
            exit 1
          fi
          case "$VIORA_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::VIORA_API_BASE_URL must start with https://"; exit 1 ;;
          esac

      - name: Checkout Android repository
        uses: actions/checkout@v4

      - name: Checkout the existing VIORA PWA (read-only)
        uses: actions/checkout@v4
        with:
          repository: prem-pk-dev/VILORA
          ref: main
          path: viora-source
          token: ${{ secrets.VIORA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the unchanged PWA frontend
        working-directory: viora-source
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Bundle PWA build and exact launcher icon
        shell: bash
        run: |
          test -f viora-source/dist/index.html
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/*
          cp -R viora-source/dist/. app/src/main/assets/
          mkdir -p app/src/main/res/drawable-nodpi
          cp viora-source/public/icons/icon-512.png app/src/main/res/drawable-nodpi/viora_icon.png
          test -f app/src/main/assets/index.html
          test -f app/src/main/res/drawable-nodpi/viora_icon.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VIORA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
